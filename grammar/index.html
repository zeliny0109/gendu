<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>九上语法</title>
<meta name="theme-color" content="#2F6FDE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C2436" media="(prefers-color-scheme: dark)">
<meta name="description" content="仁爱科普版九年级上册语法：现在完成时、被动语态、定语从句、构词法、不定代词 讲解与练习">
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA; --card:#FFFFFF; --ink:#1B2A4A; --muted:#5B6785; --line:#DCE2EE; --soft:#EEF2F9;
  --aux:#2F6FDE; --be:#C8641A; --v:#D63C72; --adv:#0E8F80; --ok:#0E9F8E; --bad:#E0457B;
  --ok-soft:#DDF4F1; --bad-soft:#FCE4EC; --aux-soft:#E3ECFC; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121826; --card:#1C2436; --ink:#E7ECF6; --muted:#97A3BD; --line:#2C3650; --soft:#232C42;
    --aux:#7AA7FF; --be:#F2A25C; --v:#FF6F9C; --adv:#34C7B4; --ok:#34C7B4; --bad:#FF6F9C;
    --ok-soft:#15332F; --bad-soft:#3A2030; --aux-soft:#1F2E4F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121826; --card:#1C2436; --ink:#E7ECF6; --muted:#97A3BD; --line:#2C3650; --soft:#232C42;
  --aux:#7AA7FF; --be:#F2A25C; --v:#FF6F9C; --adv:#34C7B4; --ok:#34C7B4; --bad:#FF6F9C;
  --ok-soft:#15332F; --bad-soft:#3A2030; --aux-soft:#1F2E4F; color-scheme:dark;
}
html{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Lexend","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:14px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 12px}
h1{font-size:1.4rem;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:600;margin:0 0 8px}
h3{font-size:1rem;font-weight:600;margin:18px 0 6px}
a{color:var(--aux)}
[hidden]{display:none !important}
button{font:inherit;color:inherit}
.tabs{display:inline-flex;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:3px}
.tabs button{font-size:.88rem;border:none;background:none;color:var(--muted);padding:6px 12px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.muted{color:var(--muted)} .small{font-size:.84rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--card);
  border-radius:12px;padding:9px 16px;cursor:pointer;font-size:.95rem;min-height:44px}
.btn.primary{background:var(--aux);border-color:var(--aux);color:#fff;font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* 主题列表 */
.topic{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:12px 14px;margin-bottom:10px}
.topic .tag{flex:none;width:42px;height:42px;border-radius:12px;background:var(--aux-soft);color:var(--aux);display:grid;place-items:center;font-weight:600;font-size:.9rem}
.topic .tt{flex:1;min-width:0}
.topic .tt b{display:block;font-weight:600}
.topic .tt span{font-size:.82rem;color:var(--muted)}
.topic .st{flex:none;font-size:.9rem;color:var(--be);letter-spacing:1px;text-align:right}
.topic .st small{display:block;color:var(--muted);font-size:.72rem;letter-spacing:0}
.back{border:none;background:none;color:var(--aux);cursor:pointer;padding:6px 0;font-size:.92rem}

/* 讲解 */
.lesson p{margin:6px 0}
.formula{background:var(--soft);border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:500}
.formula .eq{color:var(--muted);font-weight:400;font-size:.85rem;display:block}
.ex{margin:6px 0;padding-left:12px;border-left:3px solid var(--line)}
.ex .zh{display:block;font-size:.84rem;color:var(--muted)}
.chipset{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chipset span{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.88rem}
table{border-collapse:collapse;width:100%;font-size:.88rem;margin:6px 0}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted)}
.warn{background:var(--bad-soft);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:.92rem}
.warn b{color:var(--bad)}
.x{text-decoration:line-through;color:var(--bad)}
.grid{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:.84rem;margin:8px 0}
.grid div{background:var(--soft);border-radius:8px;padding:6px;text-align:center}
.grid .h{background:none;color:var(--muted);font-weight:500}
.grid button{border:1.5px solid var(--aux);background:var(--aux-soft);color:var(--ink);border-radius:8px;padding:6px 4px;cursor:pointer;font-size:.84rem;line-height:1.3}
.grid button small{display:block;color:var(--muted);font-size:.72rem}
.grid .off{opacity:.45;font-size:.75rem}
svg.tl{width:100%;height:auto;display:block;margin:6px 0;color:var(--ink)}
svg.tl .ax{stroke:var(--muted);stroke-width:1.5;opacity:.6} svg.tl .axf{fill:var(--muted);opacity:.6}
svg.tl .nowl{stroke:var(--adv);stroke-width:2.5} svg.tl .tx{fill:var(--muted);font-size:11px} svg.tl .nowt{fill:var(--adv);font-weight:600}
svg.tl .em{fill:var(--ink);font-size:11.5px} svg.tl .em2{fill:var(--v);font-size:11px}
svg.tl .fv{fill:var(--v)} svg.tl .fa{fill:var(--aux)} svg.tl .arr{fill:none;stroke:var(--aux);stroke-width:2}
svg.tl .dash{stroke:var(--ink);stroke-dasharray:3 3} svg.tl .br{stroke:var(--ink);stroke-width:1.2}

/* 句子着色 */
.s{font-size:1.08rem;line-height:1.9}
.r-aux{color:var(--aux);font-weight:600}
.r-be{color:var(--be);font-weight:600}
.r-v{color:var(--v);font-weight:600}
.r-adv{color:var(--adv);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.r-by{font-style:italic}
.r-n{font-weight:600;border-bottom:2px dotted currentColor}
.cl{color:var(--adv)} .cl .r-aux{color:var(--aux)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;margin:4px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;background:currentColor;vertical-align:-1px}

/* 变形器 */
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:.88rem;min-height:38px}
.seg button.on{border-color:var(--aux);background:var(--aux-soft);color:var(--ink);font-weight:500}
select{font:inherit;font-size:.95rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px;width:100%}
.voice{border-radius:14px;padding:10px 12px;margin:8px 0;background:var(--soft)}
.voice .lab{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.voice .fm{font-size:.85rem;color:var(--muted);margin-top:2px}
.ext{font-size:.72rem;border:1px solid var(--be);color:var(--be);border-radius:6px;padding:0 5px}

/* 练习 */
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;background:var(--aux);transition:width .3s}
.qhead{display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted)}
.qtype{font-size:.84rem;color:var(--aux);font-weight:500;margin:0 0 6px}
.q{font-size:1.1rem;line-height:1.9;margin:4px 0 12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:1rem;min-height:48px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
input.blank{font:inherit;font-size:1rem;border:none;border-bottom:2px solid var(--aux);background:var(--aux-soft);color:var(--ink);
  border-radius:6px 6px 0 0;padding:1px 6px;margin:0 2px;min-width:4ch;outline:none}
input.blank.ok{border-color:var(--ok);background:var(--ok-soft)}
input.blank.bad{border-color:var(--bad);background:var(--bad-soft)}
.hintv{color:var(--muted);font-size:.95rem}
.src{background:var(--soft);border-radius:12px;padding:8px 12px;margin:0 0 10px}
.build{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.build.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.build.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:1rem;min-height:40px}
.chip.used{visibility:hidden}
.punct{font-size:1.1rem}
.fb{border-radius:14px;padding:10px 14px;margin:12px 0;font-size:.95rem}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb b.t{display:block;margin-bottom:2px}
.fb.ok b.t{color:var(--ok)} .fb.bad b.t{color:var(--bad)}
.done{text-align:center;padding:10px 0}
.done .big{font-size:2.6rem;font-weight:600;line-height:1.2}
.done .stars{font-size:1.8rem;color:var(--be);letter-spacing:4px}
.irr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.irr label{font-size:.82rem;color:var(--muted)}
.irr input{width:100%;font:inherit;font-size:1.05rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink)}
.irr input.ok{border-color:var(--ok);background:var(--ok-soft)} .irr input.bad{border-color:var(--bad);background:var(--bad-soft)}
.foot{font-size:.75rem;color:var(--muted);text-align:center;margin-top:24px}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <h1>九上语法</h1>
    <div class="tabs" id="tabs"><button data-v="learn" class="on">学</button><button data-v="machine">变形器</button><button data-v="practice">练</button></div>
  </header>

  <section id="vLearn"></section>
  <section id="vMachine" hidden></section>
  <section id="vPractice" hidden></section>

  <p class="foot">仁爱科普版 · 九年级上册 · <a href="../">回到跟读练习</a></p>
</main>

<script>
/* ================= 动词与句子引擎 ================= */
const VERBS = {
  clean:{s:'cleans',p:'cleaned',pp:'cleaned',ing:'cleaning',zh:'打扫'},
  cook:{s:'cooks',p:'cooked',pp:'cooked',ing:'cooking',zh:'做'},
  plant:{s:'plants',p:'planted',pp:'planted',ing:'planting',zh:'种'},
  build:{s:'builds',p:'built',pp:'built',ing:'building',zh:'建'},
  write:{s:'writes',p:'wrote',pp:'written',ing:'writing',zh:'写'},
  sort:{s:'sorts',p:'sorted',pp:'sorted',ing:'sorting',zh:'分类'},
  teach:{s:'teaches',p:'taught',pp:'taught',ing:'teaching',zh:'教'},
  make:{s:'makes',p:'made',pp:'made',ing:'making',zh:'做'},
  sing:{s:'sings',p:'sang',pp:'sung',ing:'singing',zh:'唱'},
  wash:{s:'washes',p:'washed',pp:'washed',ing:'washing',zh:'洗'},
  grow:{s:'grows',p:'grew',pp:'grown',ing:'growing',zh:'种'},
  water:{s:'waters',p:'watered',pp:'watered',ing:'watering',zh:'浇'},
  check:{s:'checks',p:'checked',pp:'checked',ing:'checking',zh:'检查'},
};
for (const k in VERBS) VERBS[k].b = k;

// 名词短语：w 文字，n 人称数（1s 第一人称单数 / 3s 单数 / pl 复数），o 宾格，prop 专有名词（首字母一直大写）
const NP = (w, n, o, prop) => ({ w, n, o: o || w, prop: !!prop });
const SCENES = [
  { s:NP('Kangkang','3s',0,1), v:'clean', o:NP('the classroom','3s'), t:{pres:'every day'} },
  { s:NP('my mother','3s'), v:'cook', o:NP('dinner','3s'), t:{pres:'every day'} },
  { s:NP('the students','pl'), v:'plant', o:NP('the trees','pl'), t:{pres:'every spring',past:'last spring',fut:'next spring'} },
  { s:NP('the workers','pl'), v:'build', o:NP('a new road','3s'), t:{pres:'every year',past:'last year',fut:'next year'} },
  { s:NP('Jane','3s',0,1), v:'write', o:NP('a letter','3s'), t:{pres:'every week',past:'last week',fut:'next week'} },
  { s:NP('we','pl','us'), v:'sort', o:NP('the waste','3s'), t:{pres:'every day'} },
  { s:NP('Mr. Wang','3s',0,1), v:'teach', o:NP('this lesson','3s'), t:{pres:'every week',past:'last week',fut:'next week'} },
  { s:NP('Xiao Ya','3s',0,1), v:'make', o:NP('a model rocket','3s'), t:{pres:'every month',past:'last month',fut:'next month'} },
  { s:NP('they','pl','them'), v:'sing', o:NP('the song','3s'), t:{pres:'every morning'} },
  { s:NP('I','1s','me'), v:'wash', o:NP('the dishes','pl'), t:{pres:'every evening'} },
  { s:NP('the farmers','pl'), v:'grow', o:NP('rice','3s'), t:{pres:'every year',past:'last year',fut:'next year'} },
  { s:NP('Maria','3s',0,1), v:'water', o:NP('the flowers','pl'), t:{pres:'every morning'} },
  { s:NP('the teacher','3s'), v:'check', o:NP('our homework','3s'), t:{pres:'every day'} },
  { s:NP('he','3s','him'), v:'clean', o:NP('his room','3s'), t:{pres:'every Sunday',past:'last Sunday',fut:'next Sunday'} },
];
const DEF_T = { pres:'every day', past:'yesterday', fut:'tomorrow', prog:'now', pastprog:'at this time yesterday' };

const TENSES = {
  pres:{ name:'一般现在时', act:'动词原形 / 三单 -s', pass:'am / is / are + 过去分词' },
  past:{ name:'一般过去时', act:'动词过去式', pass:'was / were + 过去分词' },
  fut:{ name:'一般将来时', act:'will + 动词原形', pass:'will be + 过去分词' },
  prog:{ name:'现在进行时', act:'am / is / are + 现在分词(-ing)', pass:'am / is / are being + 过去分词' },
  pastprog:{ name:'过去进行时', act:'was / were + 现在分词(-ing)', pass:'was / were being + 过去分词' },
  perf:{ name:'现在完成时', act:'have / has + 过去分词', pass:'have / has been + 过去分词' },
  modal:{ name:'含情态动词', act:'should / can / must + 动词原形', pass:'should / can / must + be + 过去分词' },
};
const TENSE_KEYS = ['pres','past','fut','prog','pastprog','perf','modal'];

const beNow = n => n === '1s' ? 'am' : n === 'pl' ? 'are' : 'is';
const bePast = n => n === 'pl' ? 'were' : 'was';
const haveF = n => n === '3s' ? 'has' : 'have';
const NEG = { do:"don't", does:"doesn't", did:"didn't", will:"won't", is:"isn't", are:"aren't", was:"wasn't", were:"weren't",
  have:"haven't", has:"hasn't", should:"shouldn't", can:"can't", must:"mustn't", am:'am not' };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

// 造句：返回 [{w, r}]，r 是角色：sub 主语 / aux 助动词 / be 被动的 be / v 主要动词 / obj 宾语 / by / adv 时间 / p 标点
function build(sc, tense, voice, form) {
  const V = VERBS[sc.v];
  const S = voice === 'act' ? sc.s : sc.o;
  const n = S.n;
  let ch;
  if (voice === 'act') {
    ch = {
      pres: form === 'aff' ? [[n === '3s' ? V.s : V.b, 'v']] : [[n === '3s' ? 'does' : 'do', 'aux'], [V.b, 'v']],
      past: form === 'aff' ? [[V.p, 'v']] : [['did', 'aux'], [V.b, 'v']],
      fut: [['will', 'aux'], [V.b, 'v']],
      prog: [[beNow(n), 'aux'], [V.ing, 'v']],
      pastprog: [[bePast(n), 'aux'], [V.ing, 'v']],
      perf: [[haveF(n), 'aux'], [V.pp, 'v']],
      modal: [['should', 'aux'], [V.b, 'v']],
    }[tense];
  } else {
    ch = {
      pres: [[beNow(n), 'be'], [V.pp, 'v']],
      past: [[bePast(n), 'be'], [V.pp, 'v']],
      fut: [['will', 'aux'], ['be', 'be'], [V.pp, 'v']],
      prog: [[beNow(n), 'aux'], ['being', 'be'], [V.pp, 'v']],
      pastprog: [[bePast(n), 'aux'], ['being', 'be'], [V.pp, 'v']],
      perf: [[haveF(n), 'aux'], ['been', 'be'], [V.pp, 'v']],
      modal: [['should', 'aux'], ['be', 'be'], [V.pp, 'v']],
    }[tense];
  }
  ch = ch.map(([w, r]) => ({ w, r }));
  if (form === 'neg') ch[0] = { w: NEG[ch[0].w], r: ch[0].r };
  const subj = { w: S.w, r: 'sub', prop: S.prop };
  const tail = [];
  if (voice === 'act') tail.push({ w: sc.o.w, r: 'obj' });
  else tail.push({ w: 'by ' + sc.s.o, r: 'by' });
  let time = tense === 'modal' ? null : tense === 'perf' ? (form === 'aff' ? null : 'yet') : ((sc.t && sc.t[tense]) || DEF_T[tense]);
  if (tense === 'perf' && form === 'aff') ch.splice(1, 0, { w: 'already', r: 'adv' });
  if (time) tail.push({ w: time, r: 'adv' });
  let out;
  if (form === 'q') out = [ch[0], subj, ...ch.slice(1), ...tail, { w: '?', r: 'p' }];
  else out = [subj, ...ch, ...tail, { w: '.', r: 'p' }];
  // 大小写：句首大写，其余位置的普通名词/代词小写（I 除外）
  out.forEach((t, i) => {
    if (i === 0) t.w = cap(t.w);
    else if (t.r === 'sub' && !t.prop && t.w !== 'I') t.w = t.w.charAt(0).toLowerCase() + t.w.slice(1);
  });
  return out;
}
const plain = toks => toks.map(t => t.w).join(' ').replace(/ ([.?])$/, '$1');

// 答案比较：大小写、缩写、标点都不计较
function norm(s) {
  return String(s).toLowerCase().replace(/[’‘`]/g, "'").replace(/won't/g, 'will not').replace(/can't|cannot/g, 'can not')
    .replace(/n't/g, ' not').replace(/[.?!,;]/g, ' ').replace(/\s+/g, ' ').trim();
}

/* ================= 不规则动词 ================= */
// [原形, 过去式, 过去分词, 中文]；多个可接受答案用 / 分隔
const IRR = [
  ['cut','cut','cut','切'],['put','put','put','放'],['let','let','let','让'],['cost','cost','cost','花费'],['hurt','hurt','hurt','受伤'],['read','read','read','读'],['set','set','set','设置'],['shut','shut','shut','关'],
  ['buy','bought','bought','买'],['bring','brought','brought','带来'],['think','thought','thought','想'],['catch','caught','caught','抓'],['teach','taught','taught','教'],['fight','fought','fought','打架'],
  ['build','built','built','建造'],['send','sent','sent','发送'],['spend','spent','spent','花'],['lend','lent','lent','借出'],
  ['keep','kept','kept','保持'],['sleep','slept','slept','睡'],['feel','felt','felt','感觉'],['leave','left','left','离开'],['meet','met','met','遇见'],['feed','fed','fed','喂'],
  ['make','made','made','做'],['have','had','had','有'],['hear','heard','heard','听见'],['say','said','said','说'],['pay','paid','paid','付钱'],['tell','told','told','告诉'],['sell','sold','sold','卖'],
  ['find','found','found','找到'],['hold','held','held','举行'],['stand','stood','stood','站'],['understand','understood','understood','理解'],['lose','lost','lost','丢失'],['win','won','won','赢'],['sit','sat','sat','坐'],['get','got','got/gotten','得到'],['mean','meant','meant','意思是'],

// 每个练习题目用一个可序列化的 spec 描述，错题本存 spec，重做时重新生成
function makeQ(spec) {
  if (spec.k === 'mcq') {
    const [q, o, e] = MCQ[spec.b][spec.i];
    return { spec, type: 'mcq', title: '选择', q, opts: o, answer: o[0], exp: e };
  }
  if (spec.k === 'fs') {
    const [t, a] = FOR_SINCE[spec.i];
    return { spec, type: 'mcq', title: 'for 还是 since？', q: 'I have been here ___ ' + t + '.', opts: ['for', 'since'], fixed: true, answer: a,
      exp: a === 'for' ? `「${t}」是一段时间 → <b>for</b>` : `「${t}」是一个时间点（或一件过去的事）→ <b>since</b>` };
  }
  if (spec.k === 'irr') {
    const [b, p, pp, zh] = IRR[spec.i];
    return { spec, type: 'irr', title: '写出过去式和过去分词', base: b, zh, p, pp,
      exp: `${b} — ${p} — ${pp}　<span class="muted">（${IRR_GROUPS[irrGroup(IRR[spec.i])]}）</span>` };
  }
  if (spec.k === 'hf') {
    const [text, hint, e] = HFILL[spec.b][spec.i];
    const segs = [], ans = [];
    text.split(/(\{[^}]+\})/).forEach(part => {
      if (!part) return;
      if (part[0] === '{') { const alts = part.slice(1, -1).split('|'); segs.push({ blank: true, alts }); ans.push(alts[0]); }
      else segs.push({ text: part });
    });
    const full = segs.map(g => g.blank ? `<span class="r-v">${esc(g.alts[0])}</span>` : esc(g.text)).join('');
    return { spec, type: 'fill', title: hint ? '根据提示填空' : '填空', segs, hint, answerHTML: full, exp: e };
  }
  if (spec.k === 'hc') {
    const [src, chunks, punct, dis, e] = HCHIP[spec.b][spec.i];
    let accept = [''];
    const pool = [];
    for (const c of chunks) {
      if (typeof c === 'string') { accept = accept.map(a => a + ' ' + c); pool.push(c); }
      else { accept = accept.flatMap(a => c.or.map(o => a + ' ' + o)); c.or.filter(Boolean).forEach(o => pool.push(o)); }
    }
    const first = chunks.map(c => typeof c === 'string' ? c : c.or[0]).filter(Boolean);
    return { spec, type: 'chip', title: '用定语从句把两句合成一句', srcText: src.join(' '), pool: shuffle([...pool, ...dis]), punct,
      accept, chips: first, answerHTML: esc(first.join(' ') + punct), exp: e };
  }
  const sc = SCENES[spec.sc];

      const blank = ['aux', 'be', 'v'].includes(t.r) && !(t.w.toLowerCase().startsWith('should'));
      if (blank) { if (!cur) { cur = { blank: true, w: [] }; segs.push(cur); } cur.w.push(t.w); }
      else { cur = null; segs.push({ text: (t.r === 'p' ? '' : ' ') + t.w }); }
    });
    segs.forEach((g, j) => { if (g.blank) g.alts = [g.w.join(' ')]; else if (j === 0) g.text = g.text.trim(); });
    return { spec, type: 'fill', title: '用括号里动词的正确形式填空', segs, hint: sc.v, answerHTML: toksHTML(toks), exp: explain(sc, spec.t, spec.vo, spec.f) };
  }
  if (spec.k === 'chip') {
    const from = build(sc, spec.ft, spec.fv, spec.ff);
    const to = build(sc, spec.t, spec.vo, spec.f);
    const words = to.filter(t => t.r !== 'p');
    const dis = distractors(sc, words);

      exp: (spec.ft === 'past' && spec.t === 'perf' ? `现在完成时不能和「${from.find(t => t.r === 'adv').w}」这种具体的过去时间连用，要去掉。` : '')
        + (spec.ff === 'aff' && spec.ft === 'perf' && spec.f !== 'aff' ? 'already 要换成句末的 yet。' : '')
        + explain(sc, spec.t, spec.vo, spec.f) };

function distractors(sc, words) {
  const V = VERBS[sc.v], have = new Set(words.map(t => t.w.toLowerCase())), out = [];
  const SWAP = { is:'are', are:'is', am:'is', was:'were', were:'was', has:'have', have:'has', "hasn't":"haven't", "haven't":"hasn't",
    "isn't":"aren't", "aren't":"isn't", "wasn't":"weren't", "weren't":"wasn't", been:'be', be:'been', being:'been', does:'do', do:'does', "doesn't":"don't", "don't":"doesn't" };
  const add = w => { if (w && !have.has(w.toLowerCase()) && !out.some(x => x.toLowerCase() === w.toLowerCase())) out.push(w); };
  for (const t of words) {
    if (t.r === 'v') shuffle([V.b, V.p, V.pp, V.ing]).forEach(w => out.length < 3 && add(w));
    else if ((t.r === 'aux' || t.r === 'be') && SWAP[t.w.toLowerCase()]) {
      const w = SWAP[t.w.toLowerCase()]; add(t === words[0] ? cap(w) : w);
    }
  }
  const by = words.find(t => t.r === 'by');
  if (by && sc.s.o !== sc.s.w && sc.s.w !== 'I') add('by ' + sc.s.w);
  if (words.some(t => t.r === 'be') && !have.has('be')) add('be');
  return out.slice(0, 4);
}

function explain(sc, tense, voice, form) {
  const T = TENSES[tense], V = VERBS[sc.v];
  const time = tense === 'perf' ? (form === 'aff' ? 'already' : 'yet') : tense === 'modal' ? 'should' : ((sc.t && sc.t[tense]) || DEF_T[tense]);
  const S = voice === 'act' ? sc.s : sc.o;
  let s = `看到「${time}」→ <b>${T.name}</b>。`;
  if (voice === 'pass') s += `主语 ${S.w} 是被${V.zh}的 → <b>被动</b>：${T.pass}。`;
  else s += `主语 ${S.w} 自己去${V.zh} → <b>主动</b>：${T.act}。`;
  const fin = build(sc, tense, voice, form).find(t => ['aux', 'be', 'v'].includes(t.r));
  const agree = ['pres', 'prog', 'pastprog', 'perf'].includes(tense) || (tense === 'past' && voice === 'pass');
  if (agree && !(tense === 'pres' && voice === 'act' && form === 'aff' && S.n !== '3s')) {
    const n = S.n === '1s' ? '是 I' : S.n === 'pl' ? '是复数' : '是单数';
    s += `主语${n} → 用 <b>${fin.w.toLowerCase()}</b>。`;
  }
  if (tense === 'perf' && form !== 'aff') s += 'yet 用在否定句、疑问句句末。';
  if (voice === 'pass' && V.pp !== V.p) s += `${V.b}-${V.p}-<b>${V.pp}</b>。`;
  return s;
}

function dedupe(list, regen) {
  const seen = new Set(), out = [];

    for (let tries = 0; seen.has(JSON.stringify(s)) && tries < 20; tries++) s = regen(s);

  }

}
function regenSpec(s) {

  let g = `<line x1="12" y1="${y}" x2="306" y2="${y}" class="ax"/><path d="M306 ${y - 5}l8 5-8 5z" class="axf"/>

  const dot = (x, r) => `<circle cx="${x}" cy="${y}" r="${r || 6}" class="fv"/>`;
  if (kind === 'pres') { for (let x = 30; x <= 300; x += 30) g += `<circle cx="${x}" cy="${y}" r="3.5" class="fa"/>`; g += lab(160, 16, '经常、总是、习惯（every day / usually）', 'tx em'); }

  pp2: () => `

  attr1: () => `

  attr2: () => `

      <tr><td>一些（肯定）</td><td>a few</td><td>a little</td></tr>
      <tr><td>几乎没有（否定）</td><td>few</td><td>little</td></tr></table>
    <p class="small muted">有 a 是“还有一些”，没有 a 是“几乎没有”。some / any 可数、不可数都能用。</p>
    <h3>两者 vs 三者以上</h3>
    <table><tr><th></th><th>两者</th><th>三者以上</th></tr>
      <tr><td>每个</td><td>each</td><td>each / every</td></tr>
      <tr><td>任何一个</td><td>either</td><td>any</td></tr>
      <tr><td>都</td><td>both</td><td>all</td></tr>
      <tr><td>都不</td><td>neither</td><td>none / no</td></tr>
      <tr><td>另一个</td><td>the other</td><td>another</td></tr></table>
    <div class="warn"><b>易错：</b>问 How many / How much → 答 <b>None</b>；问 Who → 答 <b>No one / Nobody</b>；问 What → 答 <b>Nothing</b>。</div>`,

  irr: () => {
    let h = '<p>现在完成时（have + 过去分词）和被动语态（be + 过去分词）都离不开<b>过去分词</b>。规则动词加 -ed，下面这些不规则的要记住。按规律分组，好记很多：</p>';
    for (const g of ['AAA', 'ABB', 'ABA', 'ABC']) {
      h += `<h3>${IRR_GROUPS[g]}</h3><table><tr><th>原形</th><th>过去式</th><th>过去分词</th><th></th></tr>`;
      IRR.filter(x => irrGroup(x) === g).forEach(([b, p, pp, zh]) => { h += `<tr><td>${b}</td><td>${p}</td><td class="r-v">${pp}</td><td class="muted">${zh}</td></tr>`; });
      h += '</table>';
    }
    return h;
  },
};

/* ================= 存储 ================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const getWrong = () => store.get('gm:wrong', []);
function addWrong(spec) { const w = getWrong(), k = JSON.stringify(spec); if (!w.includes(k)) { w.push(k); store.set('gm:wrong', w.slice(-80)); } }
function delWrong(spec) { const k = JSON.stringify(spec); store.set('gm:wrong', getWrong().filter(x => x !== k)); }
const starsOf = sc => sc >= 9 ? 3 : sc >= 7 ? 2 : sc >= 5 ? 1 : 0;
const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);

/* ================= 视图切换 ================= */
let view = 'learn';
function show(v) {
  view = v;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#vLearn').hidden = v !== 'learn'; $('#vMachine').hidden = v !== 'machine'; $('#vPractice').hidden = v !== 'practice';
  if (v === 'learn') renderLearnList();
  if (v === 'machine') renderMachine();
  if (v === 'practice') renderPracticeList();
  window.scrollTo(0, 0);
}
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.v); };

function topicBtn(t, withStars) {
  const best = store.get('gm:best', {})[t.id];
  const st = withStars && best != null ? `<span class="st">${starStr(starsOf(best))}<small>最好 ${best}/10</small></span>` : '';
  return `<button class="topic" data-t="${t.id}"><span class="tag">${t.tag}</span><span class="tt"><b>${t.name}</b><span>${t.sub}</span></span>${st}</button>`;
}

function renderLearnList() {
  const el = $('#vLearn');
  el.innerHTML = '<p class="muted small" style="margin:0 2px 10px">按课本单元排好了。先看讲解，再去“练”。</p>' + TOPICS.map(t => topicBtn(t, false)).join('');
  el.onclick = e => { const b = e.target.closest('.topic'); if (b) renderLesson(b.dataset.t); };
}
function renderLesson(id) {
  const t = TOPICS.find(x => x.id === id), el = $('#vLearn');
  el.innerHTML = `<button class="back" id="lb">‹ 全部讲解</button>
    <div class="card lesson"><h2>${/^U/.test(t.tag) ? t.tag + ' · ' : ''}${t.name}</h2>${LESSONS[id]()}</div>
    <div class="row">${t.learnOnly ? '<button class="btn primary" id="lgo">去变形器玩一玩 ›</button>' : '<button class="btn primary" id="lgo">开始练习 ›</button>'}
    ${['intro', 'pp1', 'pv1', 'pp2', 'pv2', 'mix'].includes(id) ? '<button class="btn" id="lm">打开变形器</button>' : ''}</div>`;
  el.onclick = e => {
    const g = e.target.closest('[data-go]');
    if (g) { M.t = g.dataset.go; show('machine'); return; }
    if (e.target.id === 'lb') renderLearnList();
    if (e.target.id === 'lm') show('machine');
    if (e.target.id === 'lgo') { if (t.learnOnly) show('machine'); else { show('practice'); startQuiz(id); } }
  };
  window.scrollTo(0, 0);
}

/* ================= 变形器 ================= */
const M = { sc: 0, t: 'pres', f: 'aff' };
const FORMS = { aff:'肯定句', neg:'否定句', q:'一般疑问句' };
function renderMachine() {
  const el = $('#vMachine');
  const sc = SCENES[M.sc], T = TENSES[M.t];
  const tlKind = M.t === 'perf' ? 'perf1' : M.t;
  el.innerHTML = `
    <div class="card">
      <p class="small muted" style="margin:0 0 6px">选一句话，再点不同的时态和句型，看看哪些词在变。</p>
      <div class="row" style="flex-wrap:nowrap"><select id="mSc" aria-label="选择句子">${SCENES.map((s, i) => `<option value="${i}"${i === M.sc ? ' selected' : ''}>${esc(plain(build(s, 'pres', 'act', 'aff')))}</option>`).join('')}</select>
      <button class="btn" id="mRand" title="随机换一句" style="flex:none">🎲</button></div>
      <div class="seg" id="mT">${TENSE_KEYS.map(k => `<button data-t="${k}" class="${k === M.t ? 'on' : ''}">${TENSES[k].name}</button>`).join('')}</div>
      <div class="seg" id="mF">${Object.keys(FORMS).map(k => `<button data-f="${k}" class="${k === M.f ? 'on' : ''}">${FORMS[k]}</button>`).join('')}</div>
      ${tl(tlKind)}
      <div class="voice"><div class="lab"><span>主动 · ${sc.s.w} 去${VERBS[sc.v].zh}</span></div>
        <div class="s">${toksHTML(build(sc, M.t, 'act', M.f))}</div><div class="fm">${T.act}</div></div>
      <div class="voice"><div class="lab"><span>被动 · ${sc.o.w} 被${VERBS[sc.v].zh}</span>${T.ext ? '<span class="ext">拓展 · 了解即可</span>' : ''}</div>
        <div class="s">${toksHTML(build(sc, M.t, 'pass', M.f))}</div><div class="fm">${T.pass}</div></div>
      ${LEGEND}
    </div>
    <p class="small muted">小发现：被动句里 <span class="r-v">过去分词</span> 永远不变，变的只是前面的 <span class="r-aux">助动词</span> 和 <span class="r-be">be</span>。</p>`;
  $('#mSc').onchange = e => { M.sc = +e.target.value; renderMachine(); };
  $('#mRand').onclick = () => { let i; do i = scIdx(); while (i === M.sc); M.sc = i; renderMachine(); };
  $('#mT').onclick = e => { const b = e.target.closest('button'); if (b) { M.t = b.dataset.t; renderMachine(); } };
  $('#mF').onclick = e => { const b = e.target.closest('button'); if (b) { M.f = b.dataset.f; renderMachine(); } };
}

/* ================= 练习 ================= */
function renderPracticeList() {
  const el = $('#vPractice'), nw = getWrong().length;
  el.innerHTML = '<p class="muted small" style="margin:0 2px 10px">每轮 10 题，做错的题会自动收进错题本。</p>'
    + TOPICS.filter(t => !t.learnOnly).map(t => topicBtn(t, true)).join('')
    + `<button class="topic" data-t="wrong"${nw ? '' : ' disabled style="opacity:.5"'}><span class="tag" style="background:var(--bad-soft);color:var(--bad)">错</span><span class="tt"><b>错题本</b><span>${nw ? `还有 ${nw} 道，做对了就会移出去` : '暂时没有错题'}</span></span></button>`;
  el.onclick = e => { const b = e.target.closest('.topic'); if (b && !b.disabled) startQuiz(b.dataset.t); };
}

let Q = null;
function startQuiz(id) {
  let list;
  if (id === 'wrong') list = shuffle(getWrong()).slice(0, 10).map(s => JSON.parse(s));
  else list = dedupe(shuffle(TOPICS.find(t => t.id === id).round()), regenSpec);
  if (!list.length) return renderPracticeList();
  Q = { id, list, i: 0, right: 0, answered: false };
  renderQ();
}
function topicName(id) { return id === 'wrong' ? '错题本' : TOPICS.find(t => t.id === id).name; }

function renderQ() {
  const el = $('#vPractice');
  if (Q.i >= Q.list.length) return renderDone();
  const q = Q.cur = makeQ(Q.list[Q.i]);
  Q.answered = false;
  let body = '';
  if (q.type === 'mcq') {
    const opts = q.fixed ? q.opts : shuffle(q.opts);
    body = `<div class="q">${mk(esc(q.q)).replace(/___/g, '<span class="r-aux">____</span>')}</div>
      <div class="opts">${opts.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  } else if (q.type === 'fill') {
    let k = 0;
    // 空后面紧跟的标点和空放在一起，不让标点单独折到下一行
    body = `<div class="q">${q.segs.map((g, j) => {
      if (!g.blank) return esc(g.text).replace(j && q.segs[j - 1].blank ? /^[.?!,]+/ : /^$/, '');
      const p = (q.segs[j + 1] && !q.segs[j + 1].blank && (q.segs[j + 1].text.match(/^[.?!,]+/) || [''])[0]) || '';
      return `<span style="white-space:nowrap"><input class="blank" data-k="${k++}" style="width:8ch" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-label="填空">${esc(p)}</span>`;
    }).join('')} ${q.hint ? `<span class="hintv">(${esc(q.hint)})</span>` : ''}</div>
      <button class="btn primary" id="qCheck">检查</button>`;
  } else if (q.type === 'chip') {
    body = `<div class="src small muted">原句：<span class="s" style="color:var(--ink)">${esc(q.srcText)}</span></div>
      <div class="build" id="qBuild"></div>
      <div class="pool" id="qPool">${q.pool.map((w, i) => `<button class="chip" data-i="${i}">${esc(w)}</button>`).join('')}</div>
      <p class="small muted" style="margin:-4px 0 10px">点词语排成句子，点上面的词可以放回去。</p>
      <button class="btn primary" id="qCheck" disabled>检查</button>`;
  } else if (q.type === 'irr') {
    body = `<div class="q"><b style="font-size:1.4rem">${q.base}</b> <span class="muted">${q.zh}</span></div>
      <div class="irr"><label>过去式<input id="iP" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="next"></label>
      <label>过去分词<input id="iPP" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"></label></div>
      <button class="btn primary" id="qCheck">检查</button>`;
  }
  el.innerHTML = `<div class="qhead"><button class="back" id="qQuit">‹ ${topicName(Q.id)}</button><span style="align-self:center">${Q.i + 1} / ${Q.list.length}</span></div>
    <div class="bar"><i style="width:${Q.i / Q.list.length * 100}%"></i></div>
    <div class="card"><p class="qtype">${q.title}</p>${body}<div id="qFb"></div></div>`;
  $('#qQuit').onclick = () => { if (!Q.i || confirm('退出这一轮？已做的不计分。')) renderPracticeList(); };
  el.onclick = null;
  if (q.type === 'mcq') el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (Q.answered) return;
    const ok = b.dataset.o === q.answer;
    el.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.o === q.answer) x.classList.add('ok'); });
    if (!ok) b.classList.add('bad');
    finish(ok, '');
  });
  if (q.type === 'fill') {
    const ins = [...el.querySelectorAll('input.blank')];
    ins.forEach(inp => inp.oninput = () => inp.style.width = Math.max(8, inp.value.length + 2) + 'ch');
    ins.forEach((inp, j) => inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); if (ins[j + 1] && !Q.answered) ins[j + 1].focus(); else $('#qCheck').click(); } });
    $('#qCheck').onclick = () => {
      if (Q.answered) return next();
      const blanks = q.segs.filter(g => g.blank);
      let ok = true;
      ins.forEach((inp, j) => {
        const good = blanks[j].alts.some(a => norm(a) === norm(inp.value));
        inp.classList.add(good ? 'ok' : 'bad'); inp.readOnly = true; ok = ok && good;
      });
      finish(ok, `<div class="s">${q.answerHTML}</div>`);
    };
    setTimeout(() => ins[0] && ins[0].focus({ preventScroll: true }), 50);
  }
  if (q.type === 'chip') {
    const placed = [];
    const draw = () => {
      $('#qBuild').innerHTML = placed.map((i, j) => `<button class="chip" data-j="${j}">${esc(q.pool[i])}</button>`).join('') + (placed.length ? `<span class="punct">${q.punct}</span>` : '');
      el.querySelectorAll('#qPool .chip').forEach(b => b.classList.toggle('used', placed.includes(+b.dataset.i)));
      $('#qCheck').disabled = !placed.length && !Q.answered;
    };
    $('#qPool').onclick = e => { const b = e.target.closest('.chip'); if (b && !Q.answered && !b.classList.contains('used')) { placed.push(+b.dataset.i); draw(); } };
    $('#qBuild').onclick = e => { const b = e.target.closest('.chip'); if (b && !Q.answered) { placed.splice(+b.dataset.j, 1); draw(); } };
    $('#qCheck').onclick = () => {
      if (Q.answered) return next();
      const got = placed.map(i => q.pool[i]);
      const ok = q.accept.some(a => norm(a) === norm(got.join(' ')));
      $('#qBuild').classList.add(ok ? 'ok' : 'bad');
      finish(ok, `<div class="s">${q.answerHTML}</div>`);
    };
    draw();
  }
  if (q.type === 'irr') {
    const iP = $('#iP'), iPP = $('#iPP');
    iP.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); iPP.focus(); } };
    iPP.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#qCheck').click(); } };
    $('#qCheck').onclick = () => {
      if (Q.answered) return next();
      const okP = q.p.split('/').some(a => norm(a) === norm(iP.value)), okPP = q.pp.split('/').some(a => norm(a) === norm(iPP.value));
      iP.classList.add(okP ? 'ok' : 'bad'); iPP.classList.add(okPP ? 'ok' : 'bad'); iP.readOnly = iPP.readOnly = true;
      finish(okP && okPP, '');
    };
    setTimeout(() => iP.focus({ preventScroll: true }), 50);
  }
}
function finish(ok, answerHTML) {
  Q.answered = true;
  if (ok) Q.right++;
  const spec = Q.list[Q.i];
  if (ok && Q.id === 'wrong') delWrong(spec);
  if (!ok) addWrong(spec);
  $('#qFb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}"><b class="t">${ok ? '✓ 对了！' : '✗ 再看看'}</b>${ok ? '' : answerHTML ? '正确答案：' + answerHTML : ''}<div>${Q.cur.exp}</div></div>
    ${Q.cur.type === 'mcq' ? `<button class="btn primary" id="qNext">${Q.i + 1 < Q.list.length ? '下一题 ›' : '看成绩'}</button>` : ''}`;
  const c = $('#qCheck'); if (c) { c.textContent = Q.i + 1 < Q.list.length ? '下一题 ›' : '看成绩'; c.disabled = false; c.focus({ preventScroll: true }); }
  const n = $('#qNext'); if (n) { n.onclick = next; n.focus({ preventScroll: true }); }
  $('#qFb').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function next() { Q.i++; renderQ(); window.scrollTo(0, 0); }
function renderDone() {
  const n = Q.list.length, sc = Math.round(Q.right / n * 10), st = starsOf(sc);
  if (Q.id !== 'wrong') { const b = store.get('gm:best', {}); if (b[Q.id] == null || sc > b[Q.id]) { b[Q.id] = sc; store.set('gm:best', b); } }
  const msg = st === 3 ? '太棒了，这部分掌握得很好！' : st === 2 ? '不错！再练一轮争取三颗星。' : st === 1 ? '有进步空间，回去看看讲解再来。' : '先认真看一遍讲解，再来挑战。';
  const nw = getWrong().length;
  $('#vPractice').innerHTML = `<div class="card done"><p class="muted" style="margin:0">${topicName(Q.id)}</p>
    <div class="big">${Q.right} / ${n}</div><div class="stars">${starStr(st)}</div><p>${msg}</p>
    <div class="row" style="justify-content:center">
      <button class="btn primary" id="dAgain">再来一轮</button>
      ${Q.id !== 'wrong' && TOPICS.find(t => t.id === Q.id) ? '<button class="btn" id="dLearn">看讲解</button>' : ''}
      ${nw ? `<button class="btn" id="dWrong">错题本（${nw}）</button>` : ''}
      <button class="btn" id="dBack">返回</button></div></div>`;
  const id = Q.id;
  $('#dAgain').onclick = () => startQuiz(id);
  $('#dBack').onclick = renderPracticeList;
  if ($('#dLearn')) $('#dLearn').onclick = () => { show('learn'); renderLesson(id); };
  if ($('#dWrong')) $('#dWrong').onclick = () => startQuiz('wrong');
}

show('learn');
</script>
